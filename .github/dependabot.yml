version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # release.yml is generated by cargo-dist, which pins its own checkout
      # version and fails `dist plan` if it is edited; bump ci.yml by hand.
      - dependency-name: actions/checkout
      # Same for upload-artifact: release.yml must keep the `@v7` tag dist
      # emits, so bump ci.yml and nightly.yml by hand instead.
      - dependency-name: actions/upload-artifact
