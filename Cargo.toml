[package]
name = "furmiculi"
version = "0.1.0"
edition = "2024"
# Let-chains (1.88) and File::lock (1.89) are used; CI checks this version.
rust-version = "1.89"
description = "Queue and run coding-agent tasks defined as Markdown files"
license = "Apache-2.0"
repository = "https://github.com/giannileggio/furmiculi"

[dependencies]
anyhow = "1.0.104"
axoupdater = { version = "0.10.0", default-features = false, features = ["blocking", "github_releases"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.0"
humantime = "2.4.0"
humantime-serde = "1.1.1"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "1.1.6"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "furmi"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
