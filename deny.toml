# Dependency policy, checked in CI by cargo-deny.

[advisories]
# Fail on known vulnerabilities, and warn on unmaintained or yanked crates.
yanked = "warn"
# chrono is unmaintained (RUSTSEC-2026-0543; suggested replacements are jiff
# and time). furmi reads and writes timestamps with it in a dozen places, so
# the migration is its own change, not a dependency bump. Until then the
# advisory is ignored here rather than disabling the check.
ignore = [
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
